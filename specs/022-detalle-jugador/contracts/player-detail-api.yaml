openapi: 3.0.3
info:
  title: Player Detail API
  version: v1
  description: Consulta autenticada del detalle local de un jugador.
paths:
  /players/{id}:
    get:
      tags: [Players]
      operationId: getPlayerDetail
      summary: Obtiene el detalle de un jugador
      description: |
        Devuelve los datos persistidos del jugador, sus estadísticas de temporada si existen
        y la última cotización de la estrategia activa si existe. Nunca consulta fuentes externas.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador interno positivo del jugador.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Detalle encontrado; stats y quote pueden ser nulos.
          headers:
            X-Correlation-ID:
              description: UUID de trazabilidad del pedido.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerDetailResponse'
              examples:
                complete:
                  value:
                    player:
                      id: 42
                      externalId: '3180'
                      fullName: Bukayo Saka
                      team: Arsenal FC
                      league: PREMIER_LEAGUE
                      positions: [FORWARD]
                      nationality: England
                      age: 25
                      marketValue: 1.2450
                    stats:
                      minutesPlayed: 1980
                      goals: 12
                      assists: 9
                      shots: 61
                      keyPasses: 48
                      tackles: 21
                      dribbles: 37
                      yellowCards: 4
                      redCards: 0
                      rating: 7.42
                      fetchedAt: '2026-10-20T12:00:00Z'
                    quote:
                      value: 1.2450
                      score: 8.7500
                      status: CALCULATED
                      strategy: OFFICIAL
                      version: 1
                      calculatedAt: '2026-10-20T18:00:00Z'
                withoutComplementaryData:
                  value:
                    player:
                      id: 43
                      externalId: '4090'
                      fullName: Example Player
                      team: Example FC
                      league: LA_LIGA
                      positions: []
                      nationality: null
                      age: null
                      marketValue: 1.0000
                    stats: null
                    quote: null
        '400':
          description: El identificador no es numérico, excede el rango de int64, es cero o es negativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                malformed:
                  value:
                    error: validation_error
                    message: Uno o más filtros son inválidos
                nonPositive:
                  value:
                    error: validation_error
                    message: El id del jugador debe ser mayor a cero
        '401':
          description: Sin credenciales, o con credenciales inválidas o vencidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El identificador positivo no corresponde a un jugador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: player_not_found
                message: No existe el jugador 999999
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
  schemas:
    PlayerDetailResponse:
      type: object
      required: [player, stats, quote]
      properties:
        player:
          $ref: '#/components/schemas/PlayerResponse'
        stats:
          allOf:
            - $ref: '#/components/schemas/PlayerStatsResponse'
          nullable: true
        quote:
          allOf:
            - $ref: '#/components/schemas/CurrentQuoteResponse'
          nullable: true
    PlayerResponse:
      type: object
      required: [id, externalId, fullName, team, league, positions, marketValue]
      properties:
        id: { type: integer, format: int64 }
        externalId: { type: string }
        fullName: { type: string }
        team: { type: string }
        league:
          type: string
          enum: [PREMIER_LEAGUE, LA_LIGA, SERIE_A, BUNDESLIGA, LIGUE_1]
        positions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [GOALKEEPER, DEFENDER, MIDFIELDER, FORWARD]
        nationality: { type: string, nullable: true }
        age: { type: integer, minimum: 0, nullable: true }
        marketValue: { type: number, minimum: 0 }
    PlayerStatsResponse:
      type: object
      required: [minutesPlayed, goals, assists, shots, keyPasses, tackles, dribbles, yellowCards, redCards, rating, fetchedAt]
      properties:
        minutesPlayed: { type: integer, nullable: true }
        goals: { type: integer, nullable: true }
        assists: { type: integer, nullable: true }
        shots: { type: integer, nullable: true }
        keyPasses: { type: integer, nullable: true }
        tackles: { type: integer, nullable: true }
        dribbles: { type: integer, nullable: true }
        yellowCards: { type: integer, nullable: true }
        redCards: { type: integer, nullable: true }
        rating: { type: number, nullable: true }
        fetchedAt: { type: string, format: date-time }
    CurrentQuoteResponse:
      type: object
      required: [value, score, status, strategy, version, calculatedAt]
      properties:
        value: { type: number, minimum: 0 }
        score: { type: number, nullable: true }
        status:
          type: string
          enum: [CALCULATED, NO_STATS, INSUFFICIENT_HISTORY]
        strategy: { type: string, example: OFFICIAL }
        version: { type: integer, minimum: 1 }
        calculatedAt: { type: string, format: date-time }
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
