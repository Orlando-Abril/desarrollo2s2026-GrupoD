openapi: 3.0.3
info:
  title: Portfolio and User Transactions API
  version: 1.0.0
  description: Contract for feature 028. The running application merges these operations into its global OpenAPI document.

paths:
  /users/{id}/portfolio:
    get:
      tags: [User Market]
      summary: Get a user's current portfolio
      operationId: getUserPortfolio
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Portfolio valued at each player's current market value
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioResponse'
              example:
                userId: 12
                balance: 984.0000
                reservedCredits: 5.2500
                availableBalance: 978.7500
                positions:
                  - playerId: 44
                    playerName: Lionel Example
                    playerTeam: Inter Miami CF
                    quantity: 15
                    reservedQuantity: 3
                    availableQuantity: 12
                    averagePurchasePrice: 1.0667
                    costBasis: 16.0000
                    marketValue: 1.3000
                    currentValue: 19.5000
                    profitLoss: 3.5000
                totalCost: 16.0000
                totalCurrentValue: 19.5000
                totalProfitLoss: 3.5000
                totalEquity: 1003.5000
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/PortfolioInconsistent'

  /users/{id}/transactions:
    get:
      tags: [User Market]
      summary: Get a user's executed trades
      description: Each item is one executed match, not an entire order. Results are newest first.
      operationId: getUserTransactions
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: page
          in: query
          required: false
          description: Zero-based page number
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Number of trades per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Stable page ordered by executedAt descending and id descending
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPageResponse'
              example:
                items:
                  - id: 91
                    type: COMPRA
                    playerId: 44
                    playerName: Lionel Example
                    quantity: 3
                    price: 1.0437
                    total: 3.1311
                    executedAt: '2026-10-29T14:30:00Z'
                page: 0
                size: 20
                numberOfElements: 1
                totalElements: 1
                totalPages: 1
                first: true
                last: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the authenticated account
      description: JWT and owner-backed API keys resolve an account. Ownerless service API keys receive 401.
      operationId: getAuthenticatedUser
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Current account
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
              example:
                id: 12
                username: abril
                email: abril@example.com
                role: USER
                balance: 984.0000
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY

  headers:
    CorrelationId:
      description: UUID propagated or generated for request tracing
      schema:
        type: string
        format: uuid

  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: User identifier
      schema:
        type: integer
        format: int64
        minimum: 1

  responses:
    ValidationError:
      description: Invalid path or pagination parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: validation_error
            message: Uno o más parámetros son inválidos
    Unauthorized:
      description: Missing, invalid or expired credentials, or no user account associated with the credential
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: unauthorized
            message: Credencial ausente o inválida
    Forbidden:
      description: A USER attempted to read another account
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: forbidden
            message: No tenés permisos para esta operación
    UserNotFound:
      description: The requested account does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: user_not_found
            message: Usuario no encontrado
    PortfolioInconsistent:
      description: Holdings, trade history or market value cannot produce a consistent portfolio
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: portfolio_inconsistent
            message: No se pudo construir un portfolio consistente

  schemas:
    Money:
      type: number
      format: decimal
      multipleOf: 0.0001
      example: 1.0437

    PortfolioPositionResponse:
      type: object
      required:
        - playerId
        - playerName
        - playerTeam
        - quantity
        - reservedQuantity
        - availableQuantity
        - averagePurchasePrice
        - costBasis
        - marketValue
        - currentValue
        - profitLoss
      properties:
        playerId:
          type: integer
          format: int64
        playerName:
          type: string
        playerTeam:
          type: string
          example: Inter Miami CF
        quantity:
          type: integer
          minimum: 1
        reservedQuantity:
          type: integer
          minimum: 0
        availableQuantity:
          type: integer
          minimum: 0
        averagePurchasePrice:
          $ref: '#/components/schemas/Money'
        costBasis:
          $ref: '#/components/schemas/Money'
        marketValue:
          $ref: '#/components/schemas/Money'
        currentValue:
          $ref: '#/components/schemas/Money'
        profitLoss:
          $ref: '#/components/schemas/Money'

    PortfolioResponse:
      type: object
      required:
        - userId
        - balance
        - reservedCredits
        - availableBalance
        - positions
        - totalCost
        - totalCurrentValue
        - totalProfitLoss
        - totalEquity
      properties:
        userId:
          type: integer
          format: int64
        balance:
          $ref: '#/components/schemas/Money'
        reservedCredits:
          $ref: '#/components/schemas/Money'
        availableBalance:
          $ref: '#/components/schemas/Money'
        positions:
          type: array
          items:
            $ref: '#/components/schemas/PortfolioPositionResponse'
        totalCost:
          $ref: '#/components/schemas/Money'
        totalCurrentValue:
          $ref: '#/components/schemas/Money'
        totalProfitLoss:
          $ref: '#/components/schemas/Money'
        totalEquity:
          $ref: '#/components/schemas/Money'

    TransactionResponse:
      type: object
      required: [id, type, playerId, playerName, quantity, price, total, executedAt]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [COMPRA, VENTA]
        playerId:
          type: integer
          format: int64
        playerName:
          type: string
        quantity:
          type: integer
          minimum: 1
        price:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        executedAt:
          type: string
          format: date-time

    TransactionPageResponse:
      type: object
      required: [items, page, size, numberOfElements, totalElements, totalPages, first, last]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TransactionResponse'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        numberOfElements:
          type: integer
          minimum: 0
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        first:
          type: boolean
        last:
          type: boolean

    MeResponse:
      type: object
      required: [id, username, email, role, balance]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [USER, ADMIN]
        balance:
          $ref: '#/components/schemas/Money'

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
