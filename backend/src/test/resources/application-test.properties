# Spring Boot always loads application.properties as the test configuration base.
# When the test profile is active, properties declared here override that base.
# H2, simple cache, and loopback URLs are inherited.

# Each Spring context gets its own in-memory database. With a shared name, closing a cached context runs
# create-drop and deletes the tables that the other live contexts are still using.
spring.datasource.url=jdbc:h2:mem:${random.uuid};DB_CLOSE_DELAY=-1;MODE=PostgreSQL
