spring.application.name=demo

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.cache.type=simple
spring.data.redis.repositories.enabled=false

football-data.base-url=http://127.0.0.1:1/v4
football-data.token=test-football-data-token
football-data.connect-timeout=100ms
football-data.read-timeout=100ms
football-data.cache-ttl=1m

whoscored.base-url=http://127.0.0.1:1
whoscored.client=http
whoscored.browser.landing-path=/regions/252/tournaments/2/england-premier-league
whoscored.browser.navigation-timeout=1s
whoscored.user-agent=test-agent
whoscored.connect-timeout=100ms
whoscored.read-timeout=100ms
whoscored.request-delay=0s
whoscored.cache-ttl=1m
whoscored.block-retry.enabled=true
whoscored.block-retry.delay=0s
whoscored.tournaments.PREMIER_LEAGUE=1
whoscored.tournaments.LA_LIGA=2
whoscored.tournaments.SERIE_A=3
whoscored.tournaments.BUNDESLIGA=4
whoscored.tournaments.LIGUE_1=5
whoscored.sync.enabled=false
whoscored.sync.cron=0 0 4 * * MON
whoscored.sync.zone=UTC

management.endpoint.health.show-details=never

security.jwt.secret=test-only-secret-key-never-use-in-production-0123456789
security.jwt.expiration-ms=3600000
security.cors.allowed-origin=http://localhost:5173
