spring.application.name=demo

spring.datasource.url=jdbc:postgresql://localhost:5432/desarrollo2_grupod
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

football-data.base-url=${FOOTBALL_DATA_BASE_URL:https://api.football-data.org/v4}
football-data.token=${FOOTBALL_DATA_TOKEN}
football-data.connect-timeout=${FOOTBALL_DATA_CONNECT_TIMEOUT:3s}
football-data.read-timeout=${FOOTBALL_DATA_READ_TIMEOUT:10s}
football-data.cache-ttl=${FOOTBALL_DATA_CACHE_TTL:6h}

# WhoScored: feed JSON interno, no oficial ni estable (specs/005-whoscored-player-stats).
whoscored.base-url=${WHOSCORED_BASE_URL:https://www.whoscored.com}
# browser = Chromium headless via Playwright (Cloudflare bloquea al cliente HTTP de Java); http = RestClient.
whoscored.client=${WHOSCORED_CLIENT:browser}
whoscored.browser.landing-path=${WHOSCORED_BROWSER_LANDING_PATH:/regions/252/tournaments/2/england-premier-league}
whoscored.browser.navigation-timeout=${WHOSCORED_BROWSER_NAVIGATION_TIMEOUT:60s}
whoscored.user-agent=${WHOSCORED_USER_AGENT:Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36}
whoscored.connect-timeout=${WHOSCORED_CONNECT_TIMEOUT:5s}
whoscored.read-timeout=${WHOSCORED_READ_TIMEOUT:15s}
whoscored.request-delay=${WHOSCORED_REQUEST_DELAY:2s}
whoscored.cache-ttl=${WHOSCORED_CACHE_TTL:24h}
whoscored.block-retry.enabled=${WHOSCORED_BLOCK_RETRY_ENABLED:true}
whoscored.block-retry.delay=${WHOSCORED_BLOCK_RETRY_DELAY:10s}
whoscored.tournaments.PREMIER_LEAGUE=${WHOSCORED_TOURNAMENT_PREMIER_LEAGUE:2}
whoscored.tournaments.LA_LIGA=${WHOSCORED_TOURNAMENT_LA_LIGA:4}
whoscored.tournaments.SERIE_A=${WHOSCORED_TOURNAMENT_SERIE_A:5}
whoscored.tournaments.BUNDESLIGA=${WHOSCORED_TOURNAMENT_BUNDESLIGA:3}
whoscored.tournaments.LIGUE_1=${WHOSCORED_TOURNAMENT_LIGUE_1:22}
whoscored.sync.enabled=${WHOSCORED_SYNC_ENABLED:false}
whoscored.sync.cron=${WHOSCORED_SYNC_CRON:0 0 4 * * MON}
whoscored.sync.zone=${WHOSCORED_SYNC_ZONE:UTC}

management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
management.health.redis.enabled=true
logging.pattern.console={"timestamp":"%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}","level":"%p","logger":"%logger{36}","correlationId":"%X{correlationId}","message":"%replace(%m){'"','\\"'}"}%n

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
security.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
