spring.application.name=demo

spring.datasource.url=jdbc:postgresql://localhost:5432/desarrollo2_grupod
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

football-data.base-url=${FOOTBALL_DATA_BASE_URL:https://api.football-data.org/v4}
football-data.token=${FOOTBALL_DATA_TOKEN}
football-data.connect-timeout=${FOOTBALL_DATA_CONNECT_TIMEOUT:3s}
football-data.read-timeout=${FOOTBALL_DATA_READ_TIMEOUT:10s}
football-data.cache-ttl=${FOOTBALL_DATA_CACHE_TTL:6h}

management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
management.health.redis.enabled=true
logging.pattern.console={"timestamp":"%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}","level":"%p","logger":"%logger{36}","correlationId":"%X{correlationId}","message":"%replace(%m){'"','\\"'}"}%n

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
security.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
